<!DOCTYPE html>
<html>
<head>
    <title>Event Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        form {
            width: 350px;
            margin: 30px auto;
        }

        input, select {
            width: 100%;
            padding: 6px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 8px;
        }

        #details {
            width: 350px;
            margin: 20px auto;
            display: none;
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h2 align="center">Event Registration Form</h2>

    <form onsubmit="registerUser(); return false;">

        <label>Name</label><br>
        <input type="text" id="name" required><br>

        <label>Phone Number</label><br>
        <input type="text" id="phone" required><br>

        <label>Email</label><br>
        <input type="email" id="email" required><br>

        <label>Select Event</label><br>
        <select id="event">
            <option>Technical Quiz</option>
            <option>Web Development Workshop</option>
            <option>Hackathon</option>
            <option>Paper Presentation</option>
            <option>Coding Contest</option>
            <option>Workshop</option>
        </select><br>

        <label>Date of Event</label><br>
        <input type="date" id="date" required><br>

        <button type="submit">Register</button>

    </form>

    <div id="details"></div>

    <script>
        async function registerUser() {

            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let email = document.getElementById("email").value;
            let event = document.getElementById("event").value;
            let date = document.getElementById("date").value;

            let response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    phone: phone,
                    email: email,
                    event: event,
                    date: date
                })
            });

            let msg = await response.text();

            alert(msg);

            document.getElementById("details").innerHTML =
                "<h3>Registration Details</h3>" +
                "<p>Name : " + name + "</p>" +
                "<p>Phone : " + phone + "</p>" +
                "<p>Email : " + email + "</p>" +
                "<p>Event : " + event + "</p>" +
                "<p>Date : " + date + "</p>";

            document.getElementById("details").style.display = "block";
        }
    </script>

</body>
</html>
